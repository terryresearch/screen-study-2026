<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen Comprehension Study</title>
<!-- ============================================================
     Device Fatigue — Study 2 (strip design, v2.0)
     2 (battery 88/11, between) x 2 (processing phone/server, between)
     x 4 rated jobs within (computation x size).
     Backend: Supabase (assign_cell RPC returns condition strings so
     arm/battery text is not present in page source).
     ============================================================ -->
<style>
  :root { --accent:#1a56db; --err:#b91c1c; --muted:#6b7280; --line:#e5e7eb; --hl:#eef2ff; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         margin: 0; color: #1f2937; background: #f3f4f6; line-height: 1.5; }
  #wrap { max-width: 980px; margin: 0 auto; padding: 16px 16px 60px; }
  #progress { height: 6px; background: var(--line); border-radius: 3px; margin: 8px 0 18px; overflow: hidden; }
  #progress > div { height: 100%; width: 0%; background: var(--accent); transition: width .3s; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 26px; }
  h1 { font-size: 1.3rem; margin: 0 0 10px; }
  button.primary { background: var(--accent); color: #fff; border: 0; border-radius: 8px;
                   padding: 12px 26px; font-size: 1rem; cursor: pointer; margin-top: 16px; }
  button.primary:disabled { opacity: .45; cursor: default; }
  .error { color: var(--err); margin-top: 12px; display: none; font-weight: 600; }
  .muted { color: var(--muted); font-size: .88rem; }
  .placeholder-banner { background: #fef2f2; border: 2px dashed var(--err); color: var(--err);
                        padding: 9px 13px; border-radius: 8px; font-weight: 700; margin-bottom: 12px; font-size:.9rem; }
  .consent-box { max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; padding: 14px; background: #fcfcfd; }
  .choice label { display: block; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; cursor: pointer; }
  .choice input { margin-right: 10px; }
  textarea { width: 100%; min-height: 90px; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
  input[type=number], select, input[type=text] { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  label.block { display: block; margin: 13px 0 4px; font-weight: 600; }
  code.cc { font-size: 1.25rem; background: var(--hl); padding: 6px 14px; border-radius: 8px; letter-spacing: 1px; }
  table.likert { width: 100%; border-collapse: collapse; margin-top: 10px; }
  table.likert th { font-size: .7rem; font-weight: 600; color: var(--muted); padding: 6px 2px; vertical-align: bottom; }
  table.likert td { text-align: center; padding: 9px 2px; border-top: 1px solid var(--line); }
  table.likert td.item { text-align: left; font-size: .93rem; padding-right: 10px; width: 42%; }
  table.likert input[type=radio] { width: 17px; height: 17px; cursor: pointer; }
  /* two-pane job layout */
  .twopane { display: flex; gap: 22px; align-items: flex-start; }
  .rightpane { flex: 1; min-width: 0; }
  /* phone mockup */
  .phone { width: 292px; flex: 0 0 292px; background: #0b0f19; border-radius: 30px; padding: 10px;
           box-shadow: 0 6px 24px rgba(0,0,0,.18); position: sticky; top: 12px; }
  .screen { background: #fff; border-radius: 22px; overflow: hidden; }
  .sbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 6px;
          font-size: .78rem; font-weight: 600; color: #111827; background: #f9fafb; }
  .sbar .right { display: flex; align-items: center; gap: 6px; }
  .sig { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 10px; }
  .sig i { width: 3px; background: #111827; border-radius: 1px; display: inline-block; }
  .batt { display: inline-flex; align-items: center; gap: 4px; }
  .batt .pct { font-variant-numeric: tabular-nums; }
  .appbody { padding: 12px 12px 14px; }
  .apphead { font-weight: 800; font-size: .95rem; margin-bottom: 2px; }
  .appsub { font-size: .72rem; color: var(--muted); margin-bottom: 10px; }
  .qrow { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; margin: 6px 0; font-size: .78rem; }
  .qrow .nm { font-weight: 700; }
  .qrow .dt { color: var(--muted); font-size: .7rem; }
  .qrow.cur { border-color: var(--accent); background: var(--hl); }
  .runbtn { margin-top: 10px; width: 100%; background: #e5e7eb; color: #6b7280; border: 0; border-radius: 9px;
            padding: 9px 0; font-weight: 700; font-size: .82rem; cursor: default; }
  /* device snapshot */
  .snap { border: 1px solid var(--line); border-radius: 12px; background: #fcfcfd; padding: 16px 18px; margin: 14px 0; }
  .snap h3 { margin: 0 0 10px; font-size: .8rem; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; }
  .snapgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 26px; font-size: .92rem; }
  .snapgrid .k { color: var(--muted); }
  .snapgrid .row { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dotted var(--line); padding: 4px 0; }
  /* job strip */
  .strip { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 14px 0 6px; }
  .sbox { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: .8rem; background: #fff; white-space: nowrap; }
  .sbox.mid { border: 2px solid var(--accent); background: var(--hl); font-weight: 700; font-size: .88rem; padding: 10px 12px; }
  .sbox .tag { display: inline-block; margin-left: 7px; padding: 1px 7px; border-radius: 999px; background: #111827; color: #fff;
               font-size: .66rem; letter-spacing: .04em; vertical-align: 1px; }
  .arrow { color: var(--muted); font-size: .85rem; }
  .jobtitle { font-size: 1.02rem; font-weight: 700; margin: 2px 0 0; }
  .jobmeta { color: var(--muted); font-size: .85rem; }
  /* sliders */
  .sl { margin: 20px 0 6px; }
  .sl .prompt { font-weight: 600; margin-bottom: 6px; }
  .sl .track { display: flex; align-items: center; gap: 10px; }
  .sl input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 26px;
                          background: transparent; cursor: pointer; }
  .sl input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: #d1d5db; }
  .sl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px;
        border-radius: 50%; background: var(--accent); margin-top: -6px; }
  .sl input[type=range].naked::-webkit-slider-thumb { opacity: 0; }
  .sl input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: #d1d5db; }
  .sl input[type=range]::-moz-range-progress { background: transparent; }
  .sl input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%;
        background: var(--accent); border: 0; }
  .sl input[type=range].naked::-moz-range-thumb { opacity: 0; }
  .sl .anchors { display: flex; justify-content: space-between; font-size: .76rem; color: var(--muted); margin-top: 2px; gap: 20px; }
  .sl .val { min-width: 34px; text-align: center; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .sl .val.hide { visibility: hidden; }
  @media (max-width: 860px) { .twopane { flex-direction: column; } .phone { position: static; } }
</style>
</head>

<script>

/* ================= 2. DATA ================= */
const D = { study: CONFIG.studyName, version: CONFIG.version, status: "in_progress", blur_count: 0 };
let COND = null;   // {cell, battery, arm, tag, gate, cover}

/* ================= 3. Utilities ================= */
function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16); });
}
function xmur3(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; };
}
function mulberry32(a) {
  return function () { a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
let RNG = Math.random;
function shuffleSeeded(arr) { const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(RNG() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function el(h) { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
async function sha256hex(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join("");
}

/* ================= 4. Identity ================= */
function captureIds() {
  const p = new URLSearchParams(location.search);
  ["PROLIFIC_PID", "STUDY_ID", "SESSION_ID"].forEach(k => { if (p.get(k)) D[k] = p.get(k); });
  D.pid = D.PROLIFIC_PID || null;
  D.pid_source = D.pid ? "platform" : "generated";
  if (!D.pid) D.pid = "gen_" + uuid().slice(0, 12);
  const sidKey = "study_sid_" + CONFIG.studyName;
  D.submission_id = localStorage.getItem(sidKey) || uuid();
  try { localStorage.setItem(sidKey, D.submission_id); } catch (e) {}
  RNG = mulberry32(xmur3(D.submission_id)());
  D.force_cell = p.get("cell") || "";
}
function isMobile() {
  if (navigator.userAgentData && typeof navigator.userAgentData.mobile === "boolean")
    return navigator.userAgentData.mobile;
  const coarse = matchMedia("(pointer: coarse)").matches;
  const touch = (navigator.maxTouchPoints || 0) > 0;
  const uaHit = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  return (coarse && touch) || uaHit;
}
function captureMeta() {
  D.meta_ua = navigator.userAgent;
  D.meta_screen_w = screen.width; D.meta_screen_h = screen.height;
  D.meta_viewport_w = innerWidth; D.meta_viewport_h = innerHeight;
  D.meta_dpr = devicePixelRatio || 1; D.meta_touch_points = navigator.maxTouchPoints || 0;
}
function hashIp() {   // parallel with render; silent failure; only a salted hash is kept
  if (OFFLINE) return;
  const ctl = new AbortController(); setTimeout(() => ctl.abort(), 2500);
  fetch("https://api.ipify.org?format=json", { signal: ctl.signal })
    .then(r => r.json()).then(j => sha256hex(j.ip + CONFIG.ipSalt))
    .then(h => { D.ip_hash = h; }).catch(() => {});
}

/* ================= 5. Supabase transport ================= */
function sbHeaders(extra) {
  return Object.assign({ apikey: CONFIG.supabaseKey, Authorization: "Bearer " + CONFIG.supabaseKey,
                         "Content-Type": "application/json" }, extra || {});
}
function logEvent(event, detail) {
  if (OFFLINE) { console.log("[OFFLINE event]", event, detail || ""); return; }
  fetch(CONFIG.supabaseUrl + "/rest/v1/events", { method: "POST",
    headers: sbHeaders({ Prefer: "return=minimal" }),
    body: JSON.stringify([{ submission_id: D.submission_id, pid: D.pid, event: event,
                            detail: detail || {} }]) }).catch(() => {});
}
async function assignCondition() {
  const condKey = "study_cond_" + CONFIG.studyName;
  const cached = localStorage.getItem(condKey);
  if (cached) { COND = JSON.parse(cached); applyCond("cached"); return; }
  if (D.force_cell && /^[ABCD]$/.test(D.force_cell)) {   // testing hook; excludable via assignment_source
    COND = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(FB), ch => ch.charCodeAt(0))))[D.force_cell]; applyCond("forced");
    try { localStorage.setItem(condKey, JSON.stringify(COND)); } catch (e) {} return;
  }
  let source = "client_fallback";
  if (!OFFLINE) {
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 8000);
      const r = await fetch(CONFIG.supabaseUrl + "/rest/v1/rpc/assign_cell", { method: "POST",
        headers: sbHeaders(), body: JSON.stringify({ p_submission_id: D.submission_id, p_pid: D.pid }),
        signal: ctl.signal });
      clearTimeout(to);
      const j = await r.json();
      if (j && j.cell) { COND = j; source = "server_balanced"; }
    } catch (e) { /* fall through */ }
  }
  if (!COND) {
    const fb = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(FB), ch => ch.charCodeAt(0)))); const keys = Object.keys(fb);
    COND = fb[keys[Math.floor(Math.random() * keys.length)]];
    logEvent("assign_fallback", { cell: COND.cell });
  }
  try { localStorage.setItem(condKey, JSON.stringify(COND)); } catch (e) {}
  applyCond(source);
}
function applyCond(source) {
  D.cond_cell = COND.cell; D.cond_battery = COND.battery; D.cond_arm = COND.arm;
  D.assignment_source = source; D.ts_assigned = new Date().toISOString();
}
let SUBMITTED = false;
async function submitData() {
  D.ts_end = new Date().toISOString();
  D.duration_s = Math.round((Date.now() - START_MS) / 1000);
  D.flag_fast = D.duration_s < CONFIG.minMinutes * 60 * 0.4 ? 1 : 0;
  D.status = "complete";
  if (OFFLINE) { console.log("[OFFLINE submit]", JSON.parse(JSON.stringify(D))); SUBMITTED = true; return true; }
  const row = { submission_id: D.submission_id, pid: D.pid, status: D.status,
                duration_s: D.duration_s, ip_hash: D.ip_hash || null, data: D };
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const r = await fetch(CONFIG.supabaseUrl + "/rest/v1/responses", { method: "POST",
        headers: sbHeaders({ Prefer: "return=minimal" }), body: JSON.stringify([row]) });
      if (r.status === 201 || r.status === 409) { SUBMITTED = true; logEvent("submit_ok"); return true; }
      throw new Error("HTTP " + r.status);
    } catch (e) {
      if (attempt === 3) { logEvent("submit_fail", { err: String(e).slice(0, 180) }); return false; }
      await new Promise(res => setTimeout(res, attempt === 1 ? 1000 : 3000));
    }
  }
}
addEventListener("pagehide", () => {
  if (!SUBMITTED && D.ts_consent && !OFFLINE) {
    fetch(CONFIG.supabaseUrl + "/rest/v1/events?apikey=" + encodeURIComponent(CONFIG.supabaseKey),
      { method: "POST", headers: sbHeaders({ Prefer: "return=minimal" }), keepalive: true,
        body: JSON.stringify([{ submission_id: D.submission_id, pid: D.pid, event: "abandon",
          detail: { page: CURRENT_PAGE_ID, elapsed_s: Math.round((Date.now() - START_MS) / 1000) } }])
      }).catch(() => {});
  }
});
addEventListener("blur", () => { D.blur_count++; });

/* ================= 6. Components ================= */
const AGREE7 = ["Strongly disagree", "Disagree", "Somewhat disagree", "Neither agree nor disagree", "Somewhat agree", "Agree", "Strongly agree"];
function likertGrid(name, prompt, items, anchors, opts) {
  opts = opts || {};
  const order = opts.shuffle ? shuffleSeeded(items) : items.slice();
  let html = '<p>' + esc(prompt) + '</p><table class="likert"><tr><th></th>';
  for (let i = 0; i < anchors.length; i++) html += '<th scope="col">' + (i + 1) + '<br>' + esc(anchors[i]) + '</th>';
  html += "</tr>";
  for (const it of order) {
    html += '<tr><td class="item">' + esc(it.text) + "</td>";
    for (let v = 1; v <= anchors.length; v++)
      html += '<td><input type="radio" name="' + esc(it.code) + '" value="' + v + '" aria-label="' + esc(it.text) + ": " + v + '"></td>';
    html += "</tr>";
  }
  html += "</table>";
  return { html,
    validate() { for (const it of order) if (!document.querySelector('input[name="' + it.code + '"]:checked')) return "Please answer every item before continuing."; return null; },
    save() {
      D[name + "_order"] = order.map(i => i.code).join(",");
      for (const it of order) {
        const v = parseInt(document.querySelector('input[name="' + it.code + '"]:checked').value, 10);
        D[it.code] = v;
        if (typeof it.correct === "number") D[it.code + "_pass"] = v === it.correct ? 1 : 0;
      }
    } };
}
/* 0-100 slider, thumb hidden until first input */
function slider(code, prompt, anchorL, anchorR) {
  const html =
    '<div class="sl" data-code="' + code + '">' +
    '<div class="prompt">' + prompt + "</div>" +
    '<div class="track"><input type="range" min="0" max="100" value="50" class="naked" id="sl_' + code + '" ' +
    'aria-label="' + esc(prompt.replace(/<[^>]*>/g, "")) + '">' +
    '<div class="val hide" id="slv_' + code + '">–</div></div>' +
    '<div class="anchors"><span>0 = ' + esc(anchorL) + "</span><span>100 = " + esc(anchorR) + "</span></div></div>";
  return { code, html,
    wire() {
      const inp = document.getElementById("sl_" + code), val = document.getElementById("slv_" + code);
      const touch = () => { inp.classList.remove("naked"); val.classList.remove("hide");
        val.textContent = inp.value; inp.dataset.touched = "1"; };
      inp.addEventListener("pointerdown", touch);
      inp.addEventListener("keydown", touch);
      inp.addEventListener("input", () => { touch(); val.textContent = inp.value; });
    },
    touched() { return document.getElementById("sl_" + code).dataset.touched === "1"; },
    value() { return parseInt(document.getElementById("sl_" + code).value, 10); } };
}
/* phone mockup */
function battGlyph(pct) {
  const w = Math.max(2, Math.round(24 * pct / 100));
  return '<span class="batt"><span class="pct">' + pct + '%</span>' +

    '<rect x="30.5" y="4.5" width="2.5" height="5" rx="1.25" fill="#4b5563"/>' +
    '<rect x="2.5" y="2.5" width="' + w + '" height="9" rx="1.5" fill="#6b7280"/></svg></span>';
}
function statusBar() {
  return '<div class="sbar"><span>08:47</span><span class="right">' +

function renderJob(c, idx) {
  const key = JOB_SEQ[idx]; const j = JOBS[key];
  const s1 = slider("spd_" + key, "Look at the highlighted step. Right now, how quickly will that step run?",
    "Far below the best that step ever runs", "The very best that step ever runs");

function jobValidate() {
  for (const s of currentSliders) if (!s.touched()) return "Please answer both rating lines (click on them).";

  const key = JOB_SEQ[idx];

function renderCompFail() {
  logEvent("screenout_comprehension", { cell: D.cond_cell || "unassigned" });
  app().innerHTML = "<h1>Thank you for your time</h1>" +
    "<p>Unfortunately the comprehension check was not passed, so the study cannot continue.</p>" +
    "<p>Please <strong>return your submission</strong> on the recruitment platform — you will not be penalized and no rejection will be issued.</p>";
}
function renderDeviceBlock() {
  logEvent("screenout_device", { ua: navigator.userAgent.slice(0, 180) });
  app().innerHTML = "<h1>Desktop or laptop required</h1>" +
    "<p>This study can only be completed on a desktop or laptop computer, and it looks like you are using a phone or tablet.</p>" +
    "<p>Please <strong>return your submission</strong> on the recruitment platform — you will not be penalized. " +
    "You are welcome to start again from a desktop or laptop.</p>";
}
function renderAlreadyDone() {
  app().innerHTML = "<h1>Already completed</h1><p>Our records show this study has already been completed on this browser. " +
    "If you believe this is an error, please contact the researcher via the recruitment platform.</p>";
}
function renderComplete(saved) {
  const cc = CONFIG.completion;
  let inner = "<h1>Thank you!</h1><p>Your responses have been " + (saved ? "recorded" : "prepared") + ".</p>";
  if (!saved && !OFFLINE) {
    inner += '<p class="error" style="display:block">We had trouble reaching our server. Your completion is still valid — ' +
      "please copy the text below and send it to the researcher via the platform so no data is lost.</p>" +
      '<textarea readonly style="min-height:80px">' + esc(JSON.stringify(D)) + "</textarea>";
  }
  if (cc.platform === "prolific") {
    inner += "<p>Your completion code is <code class='cc'>" + esc(cc.code) + "</code></p>" +
      "<p>You will be redirected to Prolific shortly. If not, <a href='" + esc(cc.prolificRedirect + cc.code) + "'>click here</a>.</p>";
    setTimeout(() => { location.href = cc.prolificRedirect + cc.code; }, 4000);
  } else {
    inner += "<p>Your completion code is <code class='cc'>" + esc(cc.code) + "</code></p><p>Please copy it back into the study page on the platform.</p>";
  }
  app().innerHTML = inner;
  try { localStorage.setItem("study_done_" + CONFIG.studyName, "1"); } catch (e) {}
}

/* ================= 8. Engine ================= */
const START_MS = Date.now();
let CURRENT = -1, CURRENT_PAGE_ID = "load", PAGE_ENTERED = 0;
function showPage(i, isBack) {
  const page = PAGES[i];
  if (CURRENT >= 0 && !isBack)
    D["t_" + PAGES[CURRENT].id + "_ms"] = (D["t_" + PAGES[CURRENT].id + "_ms"] || 0) + Math.round(performance.now() - PAGE_ENTERED);
  CURRENT = i; CURRENT_PAGE_ID = page.id; PAGE_ENTERED = performance.now();
  document.querySelector("#progress > div").style.width = Math.round((i / PAGES.length) * 100) + "%";
  const c = app(); c.innerHTML = "";
  page.render(c);
  const err = el('<div class="error" role="alert"></div>');
  const btn = el('<button class="primary">' + esc(page.nextLabel || "Continue") + "</button>");
  c.appendChild(err); c.appendChild(btn);
  if (page.id === "snapshot") { btn.disabled = true; }
  btn.addEventListener("click", async () => {
    const msg = page.validate ? page.validate() : null;
    if (msg === "__handled__") return;
    if (msg) { err.textContent = msg; err.style.display = "block"; return; }
    err.style.display = "none"; btn.disabled = true; btn.textContent = "…";
    D["t_" + page.id + "_ms"] = (D["t_" + page.id + "_ms"] || 0) + Math.round(performance.now() - PAGE_ENTERED);
    try { if (page.onExit) await page.onExit(); } catch (e) { console.error(e); }
    if (i + 1 < PAGES.length) showPage(i + 1);
    else { const ok = await submitData(); renderComplete(ok); }
  });
  scrollTo(0, 0);
}

/* ================= 9. Boot ================= */
(function boot() {
  if (OFFLINE) document.body.appendChild(el('<div style="position:fixed;top:0;left:0;right:0;background:#92400e;color:#fff;text-align:center;padding:4px;font-size:.8rem;z-index:50">OFFLINE PREVIEW MODE — no endpoint configured; data logged to console only</div>'));
  captureIds(); captureMeta(); hashIp();
  D.ts_start = new Date().toISOString();
  if (localStorage.getItem("study_done_" + CONFIG.studyName)) { renderAlreadyDone(); return; }
  if (CONFIG.desktopOnly && isMobile()) { renderDeviceBlock(); return; }
  logEvent("start", {});
  showPage(0);
})();
</script>
